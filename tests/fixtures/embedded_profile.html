<!--
  Reproduces how LinkedIn embeds data in a server-rendered profile page:

  * <code id="bpr-guid-N"> elements whose JSON sits inside an HTML comment
  * a normalised envelope: {"data": ..., "included": [ typed entities ]}
  * entities identified by "$type", in a flat list, in no particular order
  * a schema.org JSON-LD block for search engines
  * a second Profile entity for the *viewer* (the nav bar avatar), which must
    not be mistaken for the profile being requested
-->
<html>
<head>
<script type="application/ld+json">
{
  "@context": "http://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "url": "https://www.linkedin.com/in/ada-lovelace-1a2b3c/"
    },
    {
      "@type": "Person",
      "name": "Ada Lovelace",
      "jobTitle": ["Principal Engineer"],
      "description": "JSON-LD fallback description.",
      "image": {
        "@type": "ImageObject",
        "contentUrl": "https://media.licdn.com/dms/image/jsonld-fallback.jpg"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressRegion": "Karnataka",
        "addressCountry": "IN"
      }
    }
  ]
}
</script>
</head>
<body>

<code id="bpr-guid-1001" style="display:none"><!--{
  "data": { "*elements": ["urn:li:fsd_profile:ACoAAA"] },
  "included": [
    {
      "$type": "com.linkedin.voyager.dash.identity.profile.Profile",
      "entityUrn": "urn:li:fsd_profile:ACoAAA",
      "publicIdentifier": "ada-lovelace-1a2b3c",
      "firstName": "Ada",
      "lastName": "Lovelace",
      "headline": "Principal Engineer at Acme Corp | Distributed systems",
      "summary": "Mathematician and engineer. I build data platforms and mentor the people who run them.",
      "locationName": "Bengaluru, Karnataka, India",
      "profilePicture": {
        "displayImageReference": {
          "vectorImage": {
            "rootUrl": "https://media.licdn.com/dms/image/v2/profile/",
            "artifacts": [
              { "width": 100, "height": 100, "fileIdentifyingUrlPathSegment": "100_100/photo.jpg" },
              { "width": 800, "height": 800, "fileIdentifyingUrlPathSegment": "800_800/photo.jpg" }
            ]
          }
        }
      },
      "backgroundImage": {
        "vectorImage": {
          "rootUrl": "https://media.licdn.com/dms/image/v2/background/",
          "artifacts": [
            { "width": 1400, "height": 350, "fileIdentifyingUrlPathSegment": "1400_350/cover.jpg" }
          ]
        }
      }
    },
    {
      "$type": "com.linkedin.voyager.dash.identity.profile.Profile",
      "entityUrn": "urn:li:fsd_profile:VIEWER",
      "publicIdentifier": "some-other-person",
      "firstName": "Viewer",
      "lastName": "Person",
      "headline": "This is the signed-in user, not the requested profile"
    }
  ]
}--></code>
