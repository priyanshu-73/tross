# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy:  push this repo to GitHub, then Render Dashboard > New > Blueprint.
# Secrets are declared with `sync: false`, which means Render prompts for them
# at deploy time and stores them in its own encrypted env store - they are never
# committed here.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free             # ample for 'public'/'embedded'; use starter for the scraper
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Generated once by Render; read it from the dashboard and send it as X-API-Key.
      - key: API_KEYS
        generateValue: true

      # --- prompted at deploy time, never stored in git ---
      - key: LINKEDIN_LI_AT
        sync: false
      - key: LINKEDIN_EMAIL
        sync: false
      - key: LINKEDIN_PASSWORD
        sync: false
      - key: PROXY_SERVER
        sync: false
      - key: PROXY_USERNAME
        sync: false
      - key: PROXY_PASSWORD
        sync: false

      # --- non-secret runtime configuration ---
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # 'voyager' calls LinkedIn's own Dash API and returns every field, but
      # needs a session (LINKEDIN_LI_AT). 'public' needs no credentials at all.
      - key: PROVIDER
        value: voyager
      - key: HEADLESS
        value: "true"
      - key: MAX_CONCURRENT_SCRAPES
        value: "1"
      - key: SCRAPE_MIN_INTERVAL_SECONDS
        value: "6"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: SESSION_STATE_PATH
        value: /data/storage_state.json
      - key: COOKIE_STORE_PATH
        value: /data/cookies.json

    # Keeps the LinkedIn session cookie across restarts, so the service does not
    # have to log in again on every deploy (each login is a fresh chance to trip
    # a checkpoint).
    disk:
      name: session
      mountPath: /data
      sizeGB: 1
