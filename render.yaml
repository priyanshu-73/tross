# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: push to GitHub, then Render Dashboard > New > Blueprint.
#
# Secrets are declared `sync: false`, which means Render prompts for them at
# deploy time and keeps them in its own encrypted store - they are never
# committed here.
#
# No persistent disk: Render's free plan does not support one, and this service
# does not need it. The session comes from LINKEDIN_LI_AT on every boot, so a
# restart re-reads it rather than recovering a cached copy. On a paid plan you
# may add a disk and point COOKIE_STORE_PATH at it.
services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # Empty = open API, no key required. To lock it down, set a value here
      # (or in the dashboard) and callers must send it as `X-API-Key`.
      - key: API_KEYS
        value: ""

      # --- prompted at deploy time, never stored in git -----------------------
      # Required for PROVIDER=voyager. Obtain it locally with
      # `python scripts/login.py`, which prints the value to paste here.
      # Leave blank if deploying with PROVIDER=public.
      - key: LINKEDIN_LI_AT
        sync: false
      # A residential proxy materially improves reliability from a datacentre
      # IP, which is what Render gives you. Optional.
      - key: PROXY_SERVER
        sync: false
      - key: PROXY_USERNAME
        sync: false
      - key: PROXY_PASSWORD
        sync: false

      # --- non-secret runtime configuration ----------------------------------
      # 'voyager' returns all ten fields but needs LINKEDIN_LI_AT.
      # 'public'  needs no credentials at all, but omits skills/certifications.
      - key: PROVIDER
        value: voyager

      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_CONCURRENT_SCRAPES
        value: "1"
      - key: SCRAPE_MIN_INTERVAL_SECONDS
        value: "6"
      - key: CACHE_TTL_SECONDS
        value: "86400"
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      # Ephemeral on the free plan - the container filesystem resets on deploy.
      - key: COOKIE_STORE_PATH
        value: /tmp/cookies.json
      - key: SESSION_STATE_PATH
        value: /tmp/storage_state.json
